name: Deployment drift

# Does each environment serve a recent release?
#
# #78: production served an Oct 15 build for a month. Five deploys had failed,
# `GET /health` answered `{"status":"ok"}` the whole time, and two shipped
# features were simply absent from the bundle users were served. Nothing in
# the system was asking the one question that would have caught it.
#
# This is the *condition* check, not the *event* check. A red workflow run
# tells you a deploy failed; this tells you the deployment is stale, which is
# also true when the deploy never ran, when it ran against the wrong app, or
# when someone rolled back by hand and forgot. The failure notification in
# `deploy.yml` covers the event. Both exist because either alone leaves the
# month-long gap open from one side.
on:
  schedule:
    # Daily. The condition being caught lasted a month; hourly would add
    # noise without catching anything a daily run misses.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare each environment against main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift measurement needs history, not just the tip.
          fetch-depth: 0

      - name: Check staging
        id: staging
        continue-on-error: true
        run: |
          # Two hours. Staging deploys automatically on green main, so the
          # only normal drift is a deploy in flight.
          scripts/check-deployed-version.sh https://ration-plan-staging.fly.dev 7200 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check production
        id: production
        continue-on-error: true
        run: |
          # Seven days. Production is deployed by hand on purpose, so being
          # behind main is the normal state after any merge — see
          # docs/release-process.md. A week without a release is a decision
          # someone made; a month is the thing that went wrong in #78.
          scripts/check-deployed-version.sh https://ration-plan.fly.dev 604800 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Raise or update an issue
        if: steps.staging.outcome == 'failure' || steps.production.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const failed = [
              ${{ steps.staging.outcome == 'failure' }} ? "staging" : null,
              ${{ steps.production.outcome == 'failure' }} ? "production" : null,
            ].filter(Boolean);

            const title = "Deployment drift: " + failed.join(" and ") + " is not serving a recent release";
            const body = [
              "A scheduled check found an environment serving a release that is",
              "behind `main` by more than its allowance, or not answering at all.",
              "",
              "Affected: **" + failed.join(", ") + "**",
              "",
              "The run output names the deployed commit and how far behind it is:",
              run,
              "",
              "This is the check added for #78, where production served a build from",
              "Oct 15 for a month while every signal said it was healthy. Treat a",
              "stale environment as a shipped-but-not-delivered incident: see",
              "`docs/release-process.md` for how to roll forward.",
            ].join("\n");

            // One open issue at a time. A daily cron that files a fresh issue
            // every morning is a mute button with extra steps.
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "deployment-drift", per_page: 10,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.data[0].number,
                body: "Still drifting as of " + new Date().toISOString() + ".\n\n" + body,
              });
              core.setFailed("Drift continues; commented on #" + existing.data[0].number);
              return;
            }

            const created = await github.rest.issues.create({
              ...context.repo, title, body, labels: ["deployment-drift"],
            });
            core.setFailed("Opened #" + created.data.number);
