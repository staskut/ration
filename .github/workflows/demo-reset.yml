name: Reset the demo

# The public demo lets anyone in as either role, with full write access to a
# shared database (`POST /auth/demo`). Visitors will rename ingredients, empty
# the plan and delete modules, which is exactly what a demo is for — but the
# next visitor should still meet the reference week.
#
# `ration-seed` upserts, so the release command already restores anything a
# visitor *changed* on every deploy. It cannot restore what they *deleted*,
# and between deploys it does not run at all. `--reset` clears first.
#
# Staging only, and not by configuration: `seed()` raises
# ProductionSeedRefused when RATION_ENV is production, so the guard is in the
# command rather than in this file's choice of app name. Both agree, and the
# one that matters is the one that cannot be edited by mistake here.
on:
  schedule:
    # 04:00 UTC, when a visitor is least likely to be mid-click.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Restore the reference week on staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP: ration-plan-staging
      URL: https://ration-plan-staging.fly.dev
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not reset::FLY_API_TOKEN_STAGING is not set."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.creds.outputs.configured == 'true'

      # `flyctl ssh console` connects to the Machine directly, so it fails
      # outright when none is running — and most nights none is. staging sits
      # at `min_machines_running = 0` with `auto_stop_machines = "suspend"`
      # (fly.toml), and `auto_start_machines` only wakes it through the HTTP
      # proxy. So a request is the wake-up call, and this job was failing at
      # 04:00 UTC whenever no visitor had been through shortly before.
      #
      # The smoke test below cannot stand in for this: by then the reseed has
      # already had to run.
      - name: Wake the machine
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              "$URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "Awake after $attempt attempt(s)."
              exit 0
            fi
            echo "Attempt $attempt: /health said ${code:-nothing}; waiting."
            sleep 5
          done
          echo "::error title=Not awake::$APP never answered /health, so the \
          reseed has nothing to connect to. Check: flyctl status --app $APP"
          exit 1

      - name: Reseed
        if: steps.creds.outputs.configured == 'true'
        run: |
          flyctl ssh console --app "$APP" --command "ration-seed --reset"

      # The reset deletes every row and writes them again. If that left the
      # app unable to answer, the demo is worse off than before this ran.
      - name: Check the demo still works
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          scripts/smoke-test.sh "$URL"

          # Both ways in, because the reset can break them independently.
          #
          # `--reset` deletes the user rows and writes them back, and
          # `_upsert_user` only sets a usable password when RATION_DEV_PASSWORD
          # is present. If it is not set on this app, the documented
          # credentials in the README come back broken — silently, since
          # one-click entry needs no password and would still work.
          demo=$(curl -fsS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"role":"planner"}' \
            "$URL/api/auth/demo")
          [ "$demo" = "204" ] || { echo "One-click demo entry returned $demo"; exit 1; }

          login=$(curl -fsS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"planner@ration.example","password":"correct-horse-battery"}' \
            "$URL/api/auth/login")
          if [ "$login" != "204" ]; then
            echo "::error title=Demo credentials broken::The README documents \
          planner@ration.example / correct-horse-battery, and sign-in returned \
          $login after the reset. Set RATION_DEV_PASSWORD on $APP."
            exit 1
          fi

          echo "Demo reset: reference week restored, both ways in still work." \
            >> "$GITHUB_STEP_SUMMARY"
