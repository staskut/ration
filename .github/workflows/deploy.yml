name: Deploy

# The gate is the point of this file.
#
# `workflow_run` fires when CI *finishes*, success or failure, so the
# conclusion check below is not decoration — without it this workflow would
# deploy a red build. CI is the one that runs lint, typecheck, the unit and
# integration suites, the Postgres run, the image build, the end-to-end suite
# and the client-drift gate; this workflow re-runs none of it and trusts none
# of it unless it passed.
#
# Green CI on main deploys **staging**, automatically. Production is reached
# only by a deliberate manual run. The direction matters: merging a pull
# request is a decision about code, and shipping to the people using the app
# is a separate decision that deserves its own moment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which app to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  # Never two deploys to the same app at once. Not cancel-in-progress: a
  # half-finished deploy that gets cancelled is the one state worse than a
  # slow queue.
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest

    # A push to main deploys staging only if CI passed. A manual run deploys
    # whatever it was asked to, which is the only way production is reached.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # The second half of the manual gate, and the half that actually blocks.
    # The choice above only decides *which* app; this decides *who may say
    # yes*. With required reviewers configured on the `production`
    # environment in repository settings, a production run waits here for a
    # human. Without that configuration this is a label and nothing more —
    # see docs/release-process.md.
    environment: ${{ github.event.inputs.environment || 'staging' }}

    env:
      # All three expressions below ask the same question, in the same
      # direction: "is this production?". That is deliberate. The previous
      # version asked "is this staging?" and defaulted the other way, which
      # meant reading three `x && a || b` expressions and holding the
      # negation in your head for each — the comment here used to say the
      # idiom was impossible to check by reading, and it was right. One
      # positive condition, repeated verbatim, can be checked by eye.
      APP: ${{ github.event.inputs.environment == 'production' && 'ration-plan' || 'ration-plan-staging' }}
      URL: ${{ github.event.inputs.environment == 'production' && 'https://ration-plan.fly.dev' || 'https://ration-plan-staging.fly.dev' }}
      # One token per app, not one for the organisation. Each is scoped to
      # the app it deploys, so a leaked staging token cannot touch
      # production — which an org-wide token would not give us.
      #
      # Both failure modes are wrong-but-safe. A missing staging secret
      # yields an empty token, and the credentials check below skips loudly
      # rather than deploying. A missing production secret falls through to
      # the staging token, which Fly then refuses for the production app.
      # Neither can deploy the wrong image to the wrong place.
      FLY_API_TOKEN: ${{ github.event.inputs.environment == 'production' && secrets.FLY_API_TOKEN || secrets.FLY_API_TOKEN_STAGING }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default, not the
          # commit CI actually tested. Deploying a different tree than the one
          # that went green is exactly the failure this gate exists to prevent.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Until the Fly apps exist there is no token, and every push to main
      # would otherwise show a red Deploy for a reason that is not a defect.
      # Skipping loudly is honest; failing is noise, and succeeding without
      # deploying would be a lie. See #50.
      - name: Check for deploy credentials
        id: creds
        run: |
          # Echo the resolved target. A mistake in the expressions above
          # deploys one app's image to the other, silently and successfully,
          # so the target is printed before anything is built.
          echo "Target: app=$APP url=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: app=$APP url=$URL"
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not deployed::FLY_API_TOKEN is not set. \
          CI passed and this commit is deployable, but no target is configured."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.creds.outputs.configured == 'true'

      # Builds the image, runs `alembic upgrade head` as the release command,
      # then rolls machines one at a time behind the healthcheck in fly.toml.
      # The short SHA of the commit CI tested, not of main: the checkout above
      # pins head_sha for exactly that reason, and a version that names a
      # different tree than the one deployed is worse than no version at all.
      - name: Version this release
        if: steps.creds.outputs.configured == 'true'
        id: version
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        run: |
          flyctl deploy --app "$APP" --remote-only \
            --build-arg RATION_VERSION="${{ steps.version.outputs.value }}"

      # Separate from the deploy so a smoke failure is its own red step with
      # its own name, rather than a line buried in deploy output.
      - name: Smoke test
        if: steps.creds.outputs.configured == 'true'
        run: scripts/smoke-test.sh "$URL"

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.configured }}" != "true" ]; then
            echo "### Not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "CI passed. No \`FLY_API_TOKEN\` is configured, so there is no target yet (#50)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ job.status }}" = "success" ]; then
            echo "### Deployed to \`$APP\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<$URL> — smoke test passed, running \`${{ steps.version.outputs.value }}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy to \`$APP\` failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The previous release is still serving. See \`docs/release-process.md\`." >> "$GITHUB_STEP_SUMMARY"
          fi
