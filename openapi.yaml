openapi: 3.1.0

info:
  title: Ration API
  version: 0.1.0
  description: |
    A weekly nutrition planner for a planner and a follower.

    This document is hand-written and is the contract (docs/hld.md AD-2). The
    backend is implemented against it and the TypeScript client is generated
    from it; CI fails if the committed client and a fresh generation disagree.
    It is never generated from FastAPI decorators — a contract derived from the
    code can describe the code but can never catch it.

    Nutrition and weight values are carried as decimal **strings**, not JSON
    numbers. The whole domain layer uses Decimal to keep a shopping list exact,
    and a float round-trip through JSON would quietly undo that.

servers:
  - url: /api

security:
  - sessionCookie: []

tags:
  - name: auth
  - name: ingredients
  - name: modules
  - name: profiles
  - name: plans
  - name: derived
  - name: follower

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Sign in and receive a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
      responses:
        "204":
          description: Signed in; session cookie set
          headers:
            Set-Cookie:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Clear the session cookie
      responses:
        "204": {description: Signed out}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Who is signed in, and which profile they are paired to
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /ingredients:
    get:
      tags: [ingredients]
      operationId: listIngredients
      summary: Search the catalog, matching names and aliases
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Matches name or alias}
        - {name: locale, in: query, schema: {type: string, default: ru}}
        - {name: section, in: query, schema: {$ref: "#/components/schemas/ShopSection"}}
      responses:
        "200":
          description: Matching ingredients
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Ingredient"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [ingredients]
      operationId: createIngredient
      summary: Add an ingredient (planner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IngredientInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ingredient"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /ingredients/{ingredientId}:
    parameters:
      - {name: ingredientId, in: path, required: true, schema: {type: string}}
    get:
      tags: [ingredients]
      operationId: getIngredient
      responses:
        "200":
          description: The ingredient
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ingredient"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [ingredients]
      operationId: updateIngredient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IngredientInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ingredient"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
    delete:
      tags: [ingredients]
      operationId: deleteIngredient
      summary: Remove an ingredient; refused while a module still uses it
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /modules:
    get:
      tags: [modules]
      operationId: listModules
      parameters:
        - {name: slot, in: query, schema: {$ref: "#/components/schemas/Slot"}}
        - {name: role, in: query, schema: {$ref: "#/components/schemas/Role"}}
        - {name: tag, in: query, schema: {type: string}}
      responses:
        "200":
          description: Matching modules
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Module"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [modules]
      operationId: createModule
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModuleInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Module"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /modules/{moduleId}:
    parameters:
      - {name: moduleId, in: path, required: true, schema: {type: string}}
    get:
      tags: [modules]
      operationId: getModule
      responses:
        "200":
          description: The module, with computed totals
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Module"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [modules]
      operationId: updateModule
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModuleInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Module"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
    delete:
      tags: [modules]
      operationId: deleteModule
      summary: Remove a module; refused while a plan still uses it
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /profiles/{profileId}:
    parameters:
      - {name: profileId, in: path, required: true, schema: {type: string}}
    get:
      tags: [profiles]
      operationId: getProfile
      responses:
        "200":
          description: Targets, budgets and rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [profiles]
      operationId: updateProfile
      summary: |
        Change the targets. Values are always supplied by the planner; Ration
        never computes or suggests a nutrition target (PRD 7).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileTargetsInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /profiles/{profileId}/slot-budgets:
    parameters:
      - {name: profileId, in: path, required: true, schema: {type: string}}
    put:
      tags: [profiles]
      operationId: replaceSlotBudgets
      summary: Replace every slot budget at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: "#/components/schemas/SlotBudget"}
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SlotBudget"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /profiles/{profileId}/ingredient-rules:
    parameters:
      - {name: profileId, in: path, required: true, schema: {type: string}}
    put:
      tags: [profiles]
      operationId: replaceIngredientRules
      summary: |
        Replace the exclusion and caution list. Rules belong to the profile, not
        to the ingredient, so one catalog can serve more than one person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: "#/components/schemas/IngredientRule"}
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/IngredientRule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /profiles/{profileId}/frequency-rules:
    parameters:
      - {name: profileId, in: path, required: true, schema: {type: string}}
    put:
      tags: [profiles]
      operationId: replaceFrequencyRules
      summary: |
        Replace the weekly tag limits. "Liver at most once a week" is a row the
        planner edits here, never a branch in code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: "#/components/schemas/FrequencyRule"}
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/FrequencyRule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /plans:
    get:
      tags: [plans]
      operationId: listPlans
      summary: Every plan for the signed-in pairing, most recent first
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PlanSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [plans]
      operationId: createPlan
      summary: |
        Start a week. Always creates exactly seven days (PRD 3.6), which is what
        lets frequency rules mean "per plan" with no rolling-window arithmetic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, start_date]
              properties:
                name: {type: string}
                start_date: {type: string, format: date}
                copy_from_plan_id:
                  type: [string, "null"]
                  description: Copy another week's entries as a starting point.
      responses:
        "201":
          description: Created, with seven days
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Plan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /plans/{planId}:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
    get:
      tags: [plans]
      operationId: getPlan
      responses:
        "200":
          description: The plan with its seven days
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Plan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [plans]
      operationId: updatePlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                status: {type: string, enum: [draft, active, archived]}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Plan"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
    delete:
      tags: [plans]
      operationId: deletePlan
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /plans/{planId}/days/{dayIndex}:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - name: dayIndex
        in: path
        required: true
        schema: {type: integer, minimum: 0, maximum: 6}
    put:
      tags: [plans]
      operationId: updatePlanDay
      summary: Set a day's template and notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day_template: {$ref: "#/components/schemas/DayTemplate"}
                notes: {type: [string, "null"]}
      responses:
        "200":
          description: Updated, with fresh validation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanDayWithValidation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /plans/{planId}/days/{dayIndex}/entries:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - name: dayIndex
        in: path
        required: true
        schema: {type: integer, minimum: 0, maximum: 6}
    post:
      tags: [plans]
      operationId: createPlanEntry
      summary: |
        Put a module in a slot. A slot takes at most one `main` entry; a second
        is a 409. Any number of `side` entries is fine.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanEntryInput"}
      responses:
        "201":
          description: Created, with fresh validation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanEntryWithValidation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /plans/{planId}/entries/{entryId}:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - {name: entryId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [plans]
      operationId: updatePlanEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                module_id: {type: string}
                portion_factor: {$ref: "#/components/schemas/Decimal"}
                position: {type: integer, minimum: 0}
      responses:
        "200":
          description: Updated, with fresh validation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanEntryWithValidation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
    delete:
      tags: [plans]
      operationId: deletePlanEntry
      responses:
        "200":
          description: Deleted, with fresh validation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationReport"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /plans/{planId}/validation:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
    get:
      tags: [derived]
      operationId: getValidation
      summary: |
        Every finding for the plan, errors first. Findings are reported against
        the planner's own configured rules; Ration never judges a plan's
        healthiness (PRD 7).
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationReport"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /plans/{planId}/shopping-list:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
    get:
      tags: [derived]
      operationId: getShoppingList
      summary: Raw weights, rounded to whole packages, grouped by shop section
      responses:
        "200":
          description: The list, including check-off state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShoppingList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /plans/{planId}/shopping-list/{ingredientId}:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - {name: ingredientId, in: path, required: true, schema: {type: string}}
    patch:
      tags: [derived]
      operationId: setShoppingItemChecked
      summary: |
        Tick an item off. State is stored server-side, not in the browser: the
        follower may shop on a different device than they planned on, and
        nothing in the system may depend on them maintaining anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checked]
              properties:
                checked: {type: boolean}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShoppingLine"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /plans/{planId}/prep-plan:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
    get:
      tags: [derived]
      operationId: getPrepPlan
      summary: Batch cook sessions with their per-container breakdown
      responses:
        "200":
          description: Cook sessions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CookSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /plans/{planId}/entries/{entryId}/feedback:
    parameters:
      - {name: planId, in: path, required: true, schema: {type: string}}
      - {name: entryId, in: path, required: true, schema: {type: string}}
    put:
      tags: [follower]
      operationId: setFeedback
      summary: |
        Rate a meal. One request, one tap. `status` is inferred from the rating —
        the follower never sets it, because the only data the real pilot produced
        was tried/not-tried and liked/disliked.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeedbackInput"}
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Feedback"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /today:
    get:
      tags: [follower]
      operationId: getToday
      summary: |
        Everything the follower needs for today in one request: slot times from
        the day's template, each module with its portion weight and totals, and
        any rating already given.
      parameters:
        - name: date
          in: query
          schema: {type: string, format: date}
          description: Defaults to today. Present so the screen can be tested.
      responses:
        "200":
          description: Today
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TodayView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ration_session

  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Signed in, but the wrong role for this operation
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: |
        Absent, or belonging to another profile. The two are deliberately
        indistinguishable so existence is never disclosed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: The request contradicts the current state
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: Well-formed but invalid
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: |
        A decimal carried as a string. JSON numbers are IEEE-754 doubles; using
        one here would reintroduce the rounding drift the domain layer exists to
        avoid, and a shopping list that is wrong by a gram stops being trusted.
      examples: ["170", "0.65", "1700.5"]

    Slot:
      type: string
      enum: [breakfast, lunch, snack, dinner, treat]

    Role:
      type: string
      enum: [main, side]
      description: A slot holds at most one `main` and any number of `side`.

    DayTemplate:
      type: string
      enum: [normal, long_shift, training, duty_24h]

    ShopSection:
      type: string
      enum:
        [meat_fish, dairy, produce, fruit, grains, nuts_pastes, oils_sauces,
         supplements, treats, other]

    Role_User:
      type: string
      enum: [planner, follower]

    CurrentUser:
      type: object
      required: [id, display_name, role, profile_id, locale]
      properties:
        id: {type: string}
        display_name: {type: string}
        role: {$ref: "#/components/schemas/Role_User"}
        profile_id: {type: string}
        locale: {type: string, default: ru}

    Ingredient:
      type: object
      required:
        [id, names, kcal_per_100g, protein_per_100g, yield_factor, yield_source,
         shop_section, is_staple]
      properties:
        id: {type: string}
        names:
          type: object
          additionalProperties: {type: string}
          description: One name per locale; `ru` is required.
        aliases:
          type: array
          items: {type: string}
          description: Resolved at entry time. Merging is always by id, never by name.
        kcal_per_100g: {$ref: "#/components/schemas/Decimal"}
        protein_per_100g: {$ref: "#/components/schemas/Decimal"}
        yield_factor:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: |
            Cooked weight divided by raw weight. Below 1 for meat and fish, 1.0
            for anything eaten as purchased, and above 1 for dry goods that
            absorb water — rice noodles are about 2.85.

            A parameter, not a constant: it bundles trim loss, water exchange
            during cooking, and the ice glaze on frozen seafood, so it varies
            with method, equipment and supplier. Editable at any time; the
            shopping list recomputes.
        yield_source:
          type: string
          enum: [as_purchased, estimated, measured]
          description: |
            Whether the factor has been weighed, is still an estimate, or does
            not apply because the item is eaten as bought. Lets the planner see
            what is left to calibrate instead of remembering it.
        package_size: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
        package_unit: {type: [string, "null"], enum: [g, ml, pcs, null]}
        shop_section: {$ref: "#/components/schemas/ShopSection"}
        is_staple:
          type: boolean
          description: Bought by the bottle; the shopping list shows it without a weight.

    IngredientInput:
      type: object
      required: [names, kcal_per_100g, protein_per_100g, yield_factor, shop_section]
      properties:
        names:
          type: object
          additionalProperties: {type: string}
        aliases: {type: array, items: {type: string}}
        kcal_per_100g: {$ref: "#/components/schemas/Decimal"}
        protein_per_100g: {$ref: "#/components/schemas/Decimal"}
        yield_factor: {$ref: "#/components/schemas/Decimal"}
        package_size: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
        package_unit: {type: [string, "null"], enum: [g, ml, pcs, null]}
        shop_section: {$ref: "#/components/schemas/ShopSection"}
        is_staple: {type: boolean, default: false}
        yield_source:
          type: string
          enum: [as_purchased, estimated, measured]
          default: as_purchased

    ModuleLine:
      type: object
      required: [ingredient_id, grams_cooked]
      properties:
        ingredient_id: {type: string}
        grams_cooked:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: Cooked weight, because that is what gets weighed when packing.
        size_is_critical:
          type: boolean
          default: false
          description: |
            The package size is structural, not a shopping convenience. A module
            built on a 75 g flatbread does not work with a 45 g one.

    Module:
      type: object
      required: [id, name, slot, role, batch_portions, lines, tags, kcal, protein_g]
      properties:
        id: {type: string}
        name: {type: string}
        slot: {$ref: "#/components/schemas/Slot"}
        role: {$ref: "#/components/schemas/Role"}
        batch_portions:
          type: integer
          minimum: 1
          maximum: 7
          description: |
            Portions cooked at once. Never multiplies a shopping quantity — a
            batch module appears once per planned day, and each is one portion.
        lines: {type: array, items: {$ref: "#/components/schemas/ModuleLine"}}
        tags: {type: array, items: {type: string}}
        prep_notes: {type: [string, "null"]}
        kcal:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          readOnly: true
          description: Computed from the lines. Never stored, never submitted.
        protein_g:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          readOnly: true

    ModuleInput:
      type: object
      required: [name, slot, lines]
      properties:
        name: {type: string}
        slot: {$ref: "#/components/schemas/Slot"}
        role: {$ref: "#/components/schemas/Role", default: main}
        batch_portions: {type: integer, minimum: 1, maximum: 7, default: 1}
        lines:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/ModuleLine"}
        tags: {type: array, items: {type: string}}
        prep_notes: {type: [string, "null"]}

    SlotBudget:
      type: object
      required: [slot, kcal_min, kcal_max, protein_min, protein_max]
      properties:
        slot: {$ref: "#/components/schemas/Slot"}
        kcal_min: {$ref: "#/components/schemas/Decimal"}
        kcal_max: {$ref: "#/components/schemas/Decimal"}
        protein_min: {$ref: "#/components/schemas/Decimal"}
        protein_max: {$ref: "#/components/schemas/Decimal"}
        optional:
          type: boolean
          default: false
          description: |
            Not expected every day. The treat slot is the case: three a week is
            the rule, so a day without one is correct rather than incomplete.

    IngredientRule:
      type: object
      required: [ingredient_id, rule]
      properties:
        ingredient_id: {type: string}
        rule: {type: string, enum: [excluded, caution]}
        threshold_g:
          oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]
          description: |
            Required when `rule` is `caution`. Compared against the total across
            a whole day, so two modules can each stay under and breach together.

    FrequencyRule:
      type: object
      required: [tag]
      properties:
        tag: {type: string}
        max_per_week: {type: [integer, "null"], minimum: 0}
        blocked_on_templates:
          type: array
          items: {$ref: "#/components/schemas/DayTemplate"}
          description: Wine on a training day is blocked by a row here, not by code.

    ProfileTargetsInput:
      type: object
      properties:
        name: {type: string}
        locale: {type: string}
        daily_kcal_target: {$ref: "#/components/schemas/Decimal"}
        daily_kcal_tolerance: {$ref: "#/components/schemas/Decimal"}
        daily_protein_min: {$ref: "#/components/schemas/Decimal"}
        daily_protein_target: {$ref: "#/components/schemas/Decimal"}

    Profile:
      type: object
      required:
        [id, name, locale, daily_kcal_target, daily_kcal_tolerance,
         daily_protein_min, daily_protein_target, slot_budgets,
         ingredient_rules, frequency_rules]
      properties:
        id: {type: string}
        name: {type: string}
        locale: {type: string}
        daily_kcal_target: {$ref: "#/components/schemas/Decimal"}
        daily_kcal_tolerance: {$ref: "#/components/schemas/Decimal"}
        daily_protein_min: {$ref: "#/components/schemas/Decimal"}
        daily_protein_target: {$ref: "#/components/schemas/Decimal"}
        slot_budgets: {type: array, items: {$ref: "#/components/schemas/SlotBudget"}}
        ingredient_rules: {type: array, items: {$ref: "#/components/schemas/IngredientRule"}}
        frequency_rules: {type: array, items: {$ref: "#/components/schemas/FrequencyRule"}}

    PlanSummary:
      type: object
      required: [id, name, profile_id, start_date, status]
      properties:
        id: {type: string}
        name: {type: string}
        profile_id: {type: string}
        start_date: {type: string, format: date}
        status: {type: string, enum: [draft, active, archived]}

    PlanEntry:
      type: object
      required: [id, slot, module_id, portion_factor, position]
      properties:
        id: {type: string}
        slot: {$ref: "#/components/schemas/Slot"}
        module_id: {type: string}
        module_name: {type: string, readOnly: true}
        role: {$ref: "#/components/schemas/Role", readOnly: true}
        portion_factor:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: Scales a module without forking it. Between 0.5 and 1.5.
        position: {type: integer, minimum: 0}
        kcal: {allOf: [{$ref: "#/components/schemas/Decimal"}], readOnly: true}
        protein_g: {allOf: [{$ref: "#/components/schemas/Decimal"}], readOnly: true}
        feedback:
          oneOf: [{$ref: "#/components/schemas/Feedback"}, {type: "null"}]
          readOnly: true

    PlanEntryInput:
      type: object
      required: [slot, module_id]
      properties:
        slot: {$ref: "#/components/schemas/Slot"}
        module_id: {type: string}
        portion_factor: {$ref: "#/components/schemas/Decimal"}
        position: {type: integer, minimum: 0}

    SlotTotals:
      type: object
      required: [slot, kcal, protein_g]
      properties:
        slot: {$ref: "#/components/schemas/Slot"}
        kcal: {$ref: "#/components/schemas/Decimal"}
        protein_g: {$ref: "#/components/schemas/Decimal"}
        description:
          type: string
          description: |
            Totals are the slot's sum across every entry, never a single entry's
            — a main and a side can each sit inside a budget and breach together.

    PlanDay:
      type: object
      required: [day_index, date, day_template, entries, kcal, protein_g]
      properties:
        day_index: {type: integer, minimum: 0, maximum: 6}
        date: {type: string, format: date}
        day_template: {$ref: "#/components/schemas/DayTemplate"}
        notes: {type: [string, "null"]}
        entries: {type: array, items: {$ref: "#/components/schemas/PlanEntry"}}
        kcal: {allOf: [{$ref: "#/components/schemas/Decimal"}], readOnly: true}
        protein_g: {allOf: [{$ref: "#/components/schemas/Decimal"}], readOnly: true}
        slot_totals:
          type: array
          items: {$ref: "#/components/schemas/SlotTotals"}
          readOnly: true

    Plan:
      type: object
      required: [id, name, profile_id, start_date, status, days]
      properties:
        id: {type: string}
        name: {type: string}
        profile_id: {type: string}
        start_date: {type: string, format: date}
        status: {type: string, enum: [draft, active, archived]}
        days:
          type: array
          minItems: 7
          maxItems: 7
          items: {$ref: "#/components/schemas/PlanDay"}
          description: Always exactly seven, created with the plan.

    PlanDayWithValidation:
      type: object
      required: [day, validation]
      properties:
        day: {$ref: "#/components/schemas/PlanDay"}
        validation: {$ref: "#/components/schemas/ValidationReport"}

    PlanEntryWithValidation:
      type: object
      required: [entry, validation]
      properties:
        entry: {$ref: "#/components/schemas/PlanEntry"}
        validation: {$ref: "#/components/schemas/ValidationReport"}
      description: |
        Mutations return the fresh report alongside the entry. Validation is
        cheap — one plan, in memory — and the planner should never be looking at
        a changed plan beside a stale report.

    Finding:
      type: object
      required: [level, code, message_key, params]
      properties:
        level: {type: string, enum: [error, warning, info]}
        code:
          type: string
          description: Stable identifier, safe to branch on.
          examples: [DAY_KCAL_OUT_OF_RANGE, FREQUENCY_EXCEEDED]
        message_key:
          type: string
          description: |
            A key the client renders. Findings never carry a formatted sentence:
            the follower's screens are Russian, and a sentence built server-side
            would be untranslatable.
        params:
          type: object
          additionalProperties: {type: string}
          description: Numbers travel as strings, for the same reason as Decimal.
        day_index: {type: [integer, "null"], minimum: 0, maximum: 6}
        slot: {oneOf: [{$ref: "#/components/schemas/Slot"}, {type: "null"}]}
        entry_id: {type: [string, "null"]}

    ValidationReport:
      type: object
      required: [findings, error_count, warning_count]
      properties:
        findings:
          type: array
          items: {$ref: "#/components/schemas/Finding"}
          description: Sorted errors first, then warnings, then info.
        error_count: {type: integer, minimum: 0}
        warning_count: {type: integer, minimum: 0}

    ShoppingLine:
      type: object
      required:
        [ingredient_id, name, shop_section, needed_raw_g, purchase_amount,
         overage_g, checked, size_is_critical, is_staple]
      properties:
        ingredient_id: {type: string}
        name: {type: string}
        shop_section: {$ref: "#/components/schemas/ShopSection"}
        needed_raw_g:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: What the plan consumes, converted from cooked by yield factor.
        purchase_amount:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: What you end up with after rounding to whole packages.
        overage_g:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: The difference, shown rather than hidden.
        packages: {type: [integer, "null"], minimum: 0}
        package_unit: {type: [string, "null"], enum: [g, ml, pcs, null]}
        checked: {type: boolean}
        size_is_critical:
          type: boolean
          description: |
            Surfaced here, not buried in the module. The pilot's one real failure
            was buying 45 g flatbreads against a 75 g spec.
        is_staple:
          type: boolean
          description: Bought by the bottle; the quantity is advisory.

    ShoppingList:
      type: object
      required: [plan_id, lines]
      properties:
        plan_id: {type: string}
        lines: {type: array, items: {$ref: "#/components/schemas/ShoppingLine"}}

    CookSessionItem:
      type: object
      required: [ingredient_id, name, grams_raw]
      properties:
        ingredient_id: {type: string}
        name: {type: string}
        grams_raw: {$ref: "#/components/schemas/Decimal"}

    CookSession:
      type: object
      required: [module_id, module_name, portions, day_indexes, items]
      properties:
        module_id: {type: string}
        module_name: {type: string}
        portions: {type: integer, minimum: 1}
        day_indexes: {type: array, items: {type: integer, minimum: 0, maximum: 6}}
        items: {type: array, items: {$ref: "#/components/schemas/CookSessionItem"}}
        prep_notes: {type: [string, "null"]}

    FeedbackInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: string
          enum: [liked, neutral, disliked]
          description: The one-tap axis. Everything else is optional.
        bloating: {type: [integer, "null"], minimum: 0, maximum: 3}
        satiety: {type: [string, "null"], enum: [too_little, right, too_much, null]}
        note: {type: [string, "null"]}

    Feedback:
      type: object
      required: [plan_entry_id, status]
      properties:
        plan_entry_id: {type: string}
        status:
          type: string
          enum: [not_tried, tried]
          readOnly: true
          description: |
            Inferred from a rating, never set directly. A first-class state
            rather than a null, because "untried" and "rejected" are different
            facts and a planner must be able to tell them apart.
        rating: {type: [string, "null"], enum: [liked, neutral, disliked, null]}
        bloating: {type: [integer, "null"], minimum: 0, maximum: 3}
        satiety: {type: [string, "null"], enum: [too_little, right, too_much, null]}
        note: {type: [string, "null"]}

    TodaySlot:
      type: object
      required: [slot, time, entries, kcal, protein_g]
      properties:
        slot: {$ref: "#/components/schemas/Slot"}
        time:
          type: string
          description: From the day's template; a long shift moves dinner to 21:00.
        entries: {type: array, items: {$ref: "#/components/schemas/TodayEntry"}}
        kcal: {$ref: "#/components/schemas/Decimal"}
        protein_g: {$ref: "#/components/schemas/Decimal"}

    TodayEntry:
      type: object
      required: [entry_id, module_id, module_name, portion_grams, kcal, protein_g, home_only]
      properties:
        entry_id: {type: string}
        module_id: {type: string}
        module_name: {type: string}
        portion_grams:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: Cooked weight, so a container can be packed on a scale.
        kcal: {$ref: "#/components/schemas/Decimal"}
        protein_g: {$ref: "#/components/schemas/Decimal"}
        home_only:
          type: boolean
          description: Not to be packed for work — reheated fish, for example.
        critical_notes: {type: array, items: {type: string}}
        feedback: {oneOf: [{$ref: "#/components/schemas/Feedback"}, {type: "null"}]}

    TodayView:
      type: object
      required: [plan_id, date, day_index, day_template, slots, kcal, protein_g]
      properties:
        plan_id: {type: string}
        date: {type: string, format: date}
        day_index: {type: integer, minimum: 0, maximum: 6}
        day_template: {$ref: "#/components/schemas/DayTemplate"}
        slots: {type: array, items: {$ref: "#/components/schemas/TodaySlot"}}
        kcal: {$ref: "#/components/schemas/Decimal"}
        protein_g: {$ref: "#/components/schemas/Decimal"}

    WebSocketMessage:
      type: object
      required: [type, plan_id, changed]
      description: |
        Sent over `WS /ws/plans/{planId}`, which OpenAPI cannot describe but
        which is part of the contract. The message carries no payload by design
        (HLD AD-6): clients refetch what changed, so there is no second copy of
        the response shapes to keep in sync.
      properties:
        type: {type: string, enum: [invalidate]}
        plan_id: {type: string}
        changed:
          type: array
          items:
            type: string
            enum: [entries, validation, shopping_list, feedback, days]

    ErrorDetail:
      type: object
      required: [code]
      properties:
        field: {type: string}
        code: {type: string}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable identifier; safe to branch on.
            message:
              type: string
              description: English, for developers. Never shown to the follower.
            details:
              type: array
              items: {$ref: "#/components/schemas/ErrorDetail"}
