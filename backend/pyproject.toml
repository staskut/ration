[project]
name = "ration"
version = "0.1.0"
description = "A weekly nutrition planner for a planner and a follower"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
ration-seed = "ration.seed.command:main"
ration-yields = "ration.seed.yields:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "import-linter>=2.3",
    "types-pyyaml>=6.0",
    "openapi-spec-validator>=0.9.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ration"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    # Ration is a Russian-language product: ingredient and module names are
    # Cyrillic by design. These rules flag Cyrillic as "ambiguous" and would
    # fire on nearly every fixture and test.
    "RUF001",  # ambiguous character in a string
    "RUF002",  # ambiguous character in a docstring
    "RUF003",  # ambiguous character in a comment
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real database; lives in tests/integration",
]

[tool.importlinter]
root_package = "ration"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no framework, no I/O, no outer layers"
type = "forbidden"
source_modules = ["ration.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "httpx",
    "starlette",
    "yaml",
    "ration.api",
    "ration.repositories",
]
