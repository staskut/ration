- slug: lunch_roll_chicken
  name: "Chicken thigh roll"
  slot: lunch
  role: main
  batch_portions: 3
  tags: [batch]
  stated_kcal: 530
  stated_protein: 38
  prep_notes: >-
    The tortilla must be 70–80 g. On a 45 g tortilla the filling will not
    wrap (section 14). Assemble the roll the evening before a work day.
  lines:
