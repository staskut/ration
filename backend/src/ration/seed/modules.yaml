# Meal modules for the reference plan, transcribed from section 9 of
# docs/sample-plan-6-days.md.
#
# Quantities are COOKED grams, exactly as the document states them, because that
# is what gets weighed when packing a container (PRD 6.1).
#
# Peppers that are roasted carry yield_factor_override: 0.65 — trimming the core
# and seeds costs about a fifth and roasting another fifth. The raw pepper in the
# shrimp dish uses the ingredient's own 1.0. See docs/decisions.md D4.
#
# Dinners are transcribed as single `main` modules: the document states them as
# whole dishes. Splitting protein from side is a capability the model supports
# (PRD 3.6) and a follow-up for the planner, not a change to this transcription.

