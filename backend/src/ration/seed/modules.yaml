- slug: lunch_roll_chicken
  name: "Ролл с куриным бедром"
  slot: lunch
  role: main
  batch_portions: 3
  tags: [batch]
  stated_kcal: 530
  stated_protein: 38
  prep_notes: >-
    Лепешка должна быть 70–80 г. На лепешке 45 г начинка не заворачивается
    (раздел 14). Собирать ролл вечером перед рабочим днем.
  lines:
    - {ingredient: tortilla_wholegrain, grams_cooked: "75", size_is_critical: true}
    - {ingredient: chicken_thigh, grams_cooked: "120"}
    - {ingredient: bell_pepper, grams_cooked: "80"}
    - {ingredient: cucumber, grams_cooked: "50"}
