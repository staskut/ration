# Ingredient catalog for the reference plan.
#
# Source of truth: docs/sample-plan-6-days.md, sections 9 (per-dish portions),
# 10 (batch quantities) and 12 (shopping list). Values are NOT taken from a
# nutrition database: the document is the oracle every golden test compares
# against, so a "more correct" value from elsewhere would break the thing it is
# meant to verify.
#
# kcal and protein are per 100 g as purchased.
# yield_factor is cooked weight / raw weight, back-solved from section 12's raw
#   quantities against sections 9-10's cooked ones.
# All numbers are quoted so PyYAML hands back strings and the loader builds
#   exact Decimals. An unquoted 0.65 would arrive as a binary float.

