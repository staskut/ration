# Ingredient catalog for the reference plan.
#
# Quantities, yields and the shopping list come from docs/sample-plan-6-days.md,
# sections 9, 10 and 12. Nutrition values do not — see the note below.
#
# kcal and protein are per 100 g IN THE STATE THE MODULE LINES DESCRIBE. For meat
#   and fish that means cooked, because module lines carry cooked weight and
#   cooking concentrates protein: raw turkey thigh is about 19 g/100 g, cooked
#   about 28 g. Reading raw values against cooked weights understates a portion's
#   protein by roughly a third.
#   These are reference figures for the preparation described, NOT fitted to the
#   document's per-dish totals. Section 9 states those as approximate and the
#   document itself says to verify against package labels, so they are treated as
#   annotations to regenerate rather than as an oracle. See docs/decisions.md D1.
# yield_factor is cooked weight / raw weight, back-solved from section 12's raw
#   quantities against sections 9-10's cooked ones. These are ESTIMATES derived
#   from the document's own ratios, not measurements; issue #53 calibrates them.
#   Leafy greens are 1.0: section 12's 650 g of spinach is only consistent with
#   the stated amounts being as-purchased. A wilting yield of ~0.25 would demand
#   nearly two kilograms. See docs/decisions.md D5.
# yield_source is `estimated` until somebody weighs it. Only the six ingredients
#   carrying real loss are marked; everything else is 1.0 by definition and needs
#   no calibration. Run `uv run ration-yields` for the worksheet. See #54.
# All numbers are quoted so PyYAML hands back strings and the loader builds
#   exact Decimals. An unquoted 0.65 would arrive as a binary float.

